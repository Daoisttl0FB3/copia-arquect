
services:
  enagenda:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      DATABASE_URL: postgresql+psycopg://enagenda:${POSTGRES_PASSWORD}@db:5432/enagenda
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: enagenda
      POSTGRES_USER: enagenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enagenda -d enagenda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
